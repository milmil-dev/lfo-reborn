# Lint, typecheck, test and build the SPA on every PR and push to main, then
# deploy it to Cloudflare Pages: main -> production, same-repo PRs -> a
# preview URL. The game art itself is not part of this build; it lives in the
# R2 assets bucket (deploy/publish-data.sh) and the build points at it through
# VITE_ASSETS_URL.

name: Web

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web.yml
      - .github/actions/**
  pull_request:
    paths:
      - web/**
      - .github/workflows/web.yml
      - .github/actions/**

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: Test and deploy web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ./.github/actions/fixtures
        with:
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.R2_DATA_BUCKET || 'lfo-data' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Public R2 bucket / custom domain serving data/assets.
          VITE_ASSETS_URL: ${{ vars.VITE_ASSETS_URL }}

      # Forks get no secrets, so only pushes and same-repo PRs deploy.
      - name: Deploy to Cloudflare Pages
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          pnpm dlx wrangler@4 pages deploy dist
          --project-name="$PAGES_PROJECT"
          --branch="$DEPLOY_BRANCH"
          --commit-hash="$DEPLOY_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'lfo-reborn' }}
          # Branch names are user-controlled: pass them through env, never inline.
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
