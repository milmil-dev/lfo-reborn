# Lint, typecheck, test and build the SPA on every PR and push to main, then
# deploy it as Cloudflare Workers static assets (wrangler.jsonc): main ->
# production, same-repo PRs -> a preview URL.
#
# The game's art, audio and JSON (data/assets) ship inside the
# deployment under /assets, the default ASSETS base, so every request players
# make is a static asset request: free and unmetered. R2 only holds the
# archive CI copies them from (one read per deploy). Wrangler uploads only files
# whose content changed, so redeploys stay small.

name: Web

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/web.yml
      - .github/actions/**
  pull_request:
    paths:
      - web/**
      - .github/workflows/web.yml
      - .github/actions/**

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  web:
    name: Test and deploy web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      # Deploy only with every secret in place: forks get none, and a deploy
      # without the R2 keys would ship a site with no game assets.
      DEPLOY: >-
        ${{ (github.event_name == 'push' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
        secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' &&
        secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: ./.github/actions/fixtures
        with:
          object: fixtures.tar.gz
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.R2_DATA_BUCKET || 'lfo-data' }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          # Stamped into the app next to the version from web/package.json.
          VITE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Skip deploy
        if: env.DEPLOY != 'true'
        run: echo "::notice::Not deploying (fork PR or deploy secrets missing; see deploy/README.md)"

      # Lands next to Vite's hashed bundles in dist/assets; the trees don't
      # overlap (data/assets holds only dex/ game/ ui/ ui-hd/ ui-svg/).
      - name: Add game assets
        if: env.DEPLOY == 'true'
        uses: ./.github/actions/fixtures
        with:
          object: assets.tar
          dest: web/dist/assets
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          bucket: ${{ vars.R2_DATA_BUCKET || 'lfo-data' }}

      # wrangler.jsonc at the repo root; uploads only assets whose hash changed.
      - name: Deploy to production
        if: env.DEPLOY == 'true' && github.event_name == 'push'
        working-directory: .
        run: pnpm dlx wrangler@4 deploy --message "$DEPLOY_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ github.sha }}

      # A version that does not take traffic, reachable at
      # pr-<n>-lfo-reborn.<subdomain>.workers.dev.
      - name: Upload PR preview
        if: env.DEPLOY == 'true' && github.event_name == 'pull_request'
        working-directory: .
        run: >-
          pnpm dlx wrangler@4 versions upload
          --preview-alias "pr-$PR_NUMBER"
          --message "$DEPLOY_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_SHA: ${{ github.event.pull_request.head.sha }}
